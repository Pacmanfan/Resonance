; Resonance firmware (docs/architecture/ARCHITECTURE.md).
; One environment: the ESP32-2432S032C device. The portable core is tested on
; the build host by firmware/tools/host_tests.py, without PlatformIO.
[platformio]
default_envs = resonance

[env:resonance]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; 3 MB single application slot, no OTA (ADR-000204).
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=1
    -DLGFX_USE_V1
    ; 1 = print every press on serial and mark it on the screen.
    -DRESONANCE_TOUCH_DEBUG=0
lib_deps =
    lovyan03/LovyanGFX@1.3.0
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.12
    https://github.com/pschatzmann/arduino-libhelix.git#f6e55a307c7577c5e3dfe1bf424a61075235fa08
; Reduced library build (ADR-000204, "space first"): the ESP-IDF libraries are
; rebuilt with Bluetooth Classic only - no BLE, no BLE Mesh, no hands-free or
; serial-port profile. Measured on the board: 57 kB more free heap in Play
; mode and an image 380 kB smaller than with the stock libraries. The first
; build compiles ESP-IDF and takes several minutes. If an option here is
; changed, delete the generated sdkconfig.resonance first: a stale one wins.
custom_sdkconfig =
    CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY=y
    '# CONFIG_BTDM_CTRL_MODE_BTDM is not set'
    '# CONFIG_BTDM_CTRL_MODE_BLE_ONLY is not set'
    '# CONFIG_BT_BLE_ENABLED is not set'
    '# CONFIG_BT_HFP_ENABLE is not set'
    '# CONFIG_BT_SPP_ENABLED is not set'
    '# CONFIG_BT_GATTS_ENABLE is not set'
    '# CONFIG_BT_GATTC_ENABLE is not set'
    '# CONFIG_BT_BLE_SMP_ENABLE is not set'
    '# CONFIG_BLE_MESH is not set'
    '# CONFIG_BT_BLE_42_FEATURES_SUPPORTED is not set'
    '# CONFIG_BT_BLE_50_FEATURES_SUPPORTED is not set'
