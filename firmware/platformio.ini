; Resonance firmware (docs/architecture/ARCHITECTURE.md).
; One environment: the ESP32-2432S032C device. The portable core is tested on
; the build host by firmware/tools/host_tests.py, without PlatformIO.
[platformio]
default_envs = resonance

[env:resonance]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; 3 MB single application slot, no OTA (ADR-000204).
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=1
    -DLGFX_USE_V1
lib_deps =
    lovyan03/LovyanGFX@1.3.0
